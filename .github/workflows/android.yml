name: Android test APK
on:
  push:
    branches: [main, master, codex/github-build-and-takeover]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      stable-signing: ${{ steps.signing.outputs.stable }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - name: Restore persistent test signing key
        id: signing
        env:
          MG_DEBUG_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.MG_DEBUG_KEYSTORE_BASE64 || '' }}
        run: |
          if [ -z "$MG_DEBUG_KEYSTORE_BASE64" ]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Checks will run, but no release will be published until MG_DEBUG_KEYSTORE_BASE64 is configured."
          else
            mkdir -p "$HOME/.android"
            printf '%s' "$MG_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android > "$RUNNER_TEMP/test-certificate.txt"
            grep -q 'FB:67:0D:1D:96:C2:8B:9E:27:0D:36:F8:D6:57:53:E3:6B:30:8D:E8' "$RUNNER_TEMP/test-certificate.txt"
            echo "MG_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and verify
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain
          mkdir -p verified-build
          cp app/build/outputs/apk/debug/app-debug.apk verified-build/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk verified-build/app-debug-androidTest.apk
          ./gradlew :app:assembleDebug -PMG_PREVIEW=true --no-daemon --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk verified-build/app-preview.apk
      - name: Verify stable APK certificate
        if: steps.signing.outputs.stable == 'true'
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs verified-build/app-debug.apk > verified-build/SIGNING-CERTIFICATE.txt
          "$APKSIGNER" verify --print-certs verified-build/app-preview.apk > verified-build/PREVIEW-CERTIFICATE.txt
          grep -qi 'certificate SHA-1 digest: fb670d1d96c28b9e270d36f8d65753e36b308de8' verified-build/PREVIEW-CERTIFICATE.txt
          cat verified-build/SIGNING-CERTIFICATE.txt
          grep -qi 'certificate SHA-1 digest: fb670d1d96c28b9e270d36f8d65753e36b308de8' verified-build/SIGNING-CERTIFICATE.txt
      - name: Upload phone testing APK
        uses: actions/upload-artifact@v4
        with:
          name: MigraineGuard-debug-apk
          path: verified-build/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Save Room schema
        uses: actions/upload-artifact@v4
        with:
          name: Room-schema
          path: app/schemas
          if-no-files-found: error
          retention-days: 7
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
  android-runtime:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MigraineGuard-debug-apk
          path: verified-build
      - name: Enable KVM for the hosted test emulator
        run: sudo chmod 666 /dev/kvm
      - name: Test account isolation, health reads, migrations, backups and navigation on Android
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: |
            adb shell wm size 900x1600
            adb shell wm density 420
            adb install verified-build/app-debug.apk
            adb install verified-build/app-debug-androidTest.apk
            adb shell settings put global window_animation_scale 1.0
            adb shell settings put global transition_animation_scale 1.0
            adb shell settings put global animator_duration_scale 1.0
            adb shell settings put system font_scale 1.25
            adb shell am instrument -w -e class com.migraineguard.app.FullAppSimulationTest#waterFoodMedicationAndWeightActionsPersistActualSyntheticRecords,com.migraineguard.app.FullAppSimulationTest#settingsReminderIntervalsAiKeysAppearanceAndOfflineCoachAreFunctional com.migraineguard.app.test/androidx.test.runner.AndroidJUnitRunner > android-large-font-preflight-results.txt
            adb pull /sdcard/Android/data/com.migraineguard.app/files/verification ui-verification-preflight || true
            cat android-large-font-preflight-results.txt
            grep -q 'OK (2 tests)' android-large-font-preflight-results.txt
            adb shell settings put system font_scale 1.0
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0
            adb shell am instrument -w com.migraineguard.app.test/androidx.test.runner.AndroidJUnitRunner > android-runtime-results.txt
            adb pull /sdcard/Android/data/com.migraineguard.app/files/verification ui-verification || true
            cat android-runtime-results.txt
            grep -q 'OK (44 tests)' android-runtime-results.txt
            adb shell settings put global window_animation_scale 1.0
            adb shell settings put global transition_animation_scale 1.0
            adb shell settings put global animator_duration_scale 1.0
            adb shell settings put system font_scale 1.25
            adb shell am instrument -w -e class com.migraineguard.app.SwipeNavigationTest,com.migraineguard.app.TrainerFlowTest,com.migraineguard.app.FullAppSimulationTest com.migraineguard.app.test/androidx.test.runner.AndroidJUnitRunner > android-gesture-results.txt
            adb pull /sdcard/Android/data/com.migraineguard.app/files/verification ui-verification-large-font || true
            adb logcat -d -s AndroidRuntime:E > android-crash-log.txt
            cat android-gesture-results.txt
            grep -q 'OK (13 tests)' android-gesture-results.txt
            adb shell settings put system font_scale 1.0
            adb shell am start -n com.migraineguard.app/.MainActivity
            sleep 5
            adb shell monkey -p com.migraineguard.app --pct-syskeys 0 --pct-appswitch 0 --ignore-security-exceptions --throttle 100 -s 26026 300 > android-smoke-results.txt
            cat android-smoke-results.txt
            adb logcat -d -s AndroidRuntime:E > android-crash-log.txt
            if grep -q "FATAL EXCEPTION" android-crash-log.txt; then exit 1; fi
            adb exec-out screencap -p > android-startup.png
      - name: Save Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-runtime-evidence
          path: |
            android-runtime-results.txt
            android-large-font-preflight-results.txt
            android-gesture-results.txt
            android-smoke-results.txt
            android-crash-log.txt
            android-startup.png
            ui-verification/*.png
            ui-verification/*.txt
            ui-verification-large-font/*.png
            ui-verification-large-font/*.txt
            ui-verification-preflight/*.png
            ui-verification-preflight/*.txt
          if-no-files-found: ignore
          retention-days: 7
  publish:
    needs: [build, android-runtime]
    if: github.event_name == 'push' && needs.build.outputs.stable-signing == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: MigraineGuard-debug-apk
          path: phone-build
      - name: Publish verified APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          test -n "$VERSION"
          TAG="v$VERSION-debug"
          APK="phone-build/MigraineGuard-v$VERSION-debug.apk"
          mv phone-build/app-debug.apk "$APK"
          PREVIEW="phone-build/MigraineGuard-v$VERSION-preview.apk"
          mv phone-build/app-preview.apk "$PREVIEW"
          sha256sum "$APK" "$PREVIEW" > phone-build/SHA256SUMS.txt
          cat > phone-build/notes.md <<'NOTES'
          Select muscles and press Build today's workout immediately. Training preferences are optional; the former mandatory age/setup checkbox no longer blocks generating or logging workouts. Default workouts start with beginner-friendly bodyweight choices; equipment/goals/experience remain editable.

          The anatomical selector adds 100–300% pinch/button zoom, pan, double-tap/Fit controls and corrected male rear-head artwork. Zoomed drawing and touch targets share the same transform.

          An exercise/machine library provides setup steps for all 35 catalog movements and nine offline GIF demonstrations. Guides have Play/Pause/Restart and visible CC BY-SA attribution. A guide can prefill the editable log while protecting unsaved drafts; movements without matching media show honest text-only guidance.

          Additional fixes preserve exact plan creation timestamps across JSON restore, separate internal guide choices from external draft requests, validate weight entries and improve action labels.

          Release gates include JVM tests/lint, retained Standard/Preview signing, 44 Android runtime tests, 13 larger-font animation-enabled repeats and a seeded 300-event smoke/crash check. Synthetic emulator checks do not establish actual watch sync, live OAuth/Drive/provider quality or OEM reminder delivery. Read docs/SIMULATION_REPORT.md and docs/UPDATE_1_15_0.md for exact results and limits.

          Choose Standard to update the retained com.migraineguard.app installation; Preview installs separately. Preserve existing records when resolving a signing conflict.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; it will not be overwritten."
          else
            gh release create "$TAG" "$APK" "$PREVIEW" phone-build/SIGNING-CERTIFICATE.txt phone-build/SHA256SUMS.txt --target "$GITHUB_SHA" --title "MigraineGuard v$VERSION — Android test APK" --notes-file phone-build/notes.md --latest
          fi
