name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Grant gradlew
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MigraineGuard-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0-debug"
          # delete tag/release if exists
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "MigraineGuard v1.0.0 debug" \
            --notes "Full v1 debug build: polished UI, dark mode, migraine history, water, Health Connect/Samsung sync, food scan, weather, insights, settings.

Install: download MigraineGuard-debug.apk (may appear as app-debug.apk), allow unknown apps, install.

Needs on device for full features: location, camera, Health Connect. Optional keys in local.properties for Google Sign-In / AI."
          # rename asset if needed
          true
